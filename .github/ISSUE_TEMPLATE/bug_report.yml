name: Bug report
description: Something is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please **redact** your bot token and chat id.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set TRANSPORT=...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - direct (Bot API)
        - gateway (local tg-gateway)
        - Not sure
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "e.g. v22.18.0 (node --version)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / distro
      placeholder: "e.g. Debian 12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the output (journalctl or stdout). Redact secrets.
      render: shell
    validations:
      required: false
